name: Documentation Issue
description: Report missing, incorrect, or outdated documentation.
title: "[DOCS] "
labels:
  - documentation

assignees:
  - WelshPigeon

body:
  - type: textarea
    id: issue
    attributes:
      label: Documentation Issue
      description: Describe the issue with the documentation.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Suggested Improvement
      description: Explain what should be changed or added.

  - type: input
    id: location
    attributes:
      label: Affected File/Page
      placeholder: README.md

  - type: textarea
    id: additional
    attributes:
      label: Additional Context